<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9ADCF5">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>ぴよランナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#9ADCF5; --ink:#2B3A55; --card:#FFFFFF; --chip:#EEF6FB; --sun:#FFC93C; --accent:#FF8A3D; --accent-dark:#C9601E;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#1D2B45; --ink:#F3F6FB; --card:#2B3A55; --chip:#223149; }
}
:root[data-theme="dark"]{ --bg:#1D2B45; --ink:#F3F6FB; --card:#2B3A55; --chip:#223149; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#wrap{position:relative;width:100%;height:100%;overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none}
.hud{
  position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  pointer-events:none;font-weight:800;font-size:clamp(17px,4.4vw,24px);color:#2B3A55;
}
.hud[hidden]{display:none}
.hud-left,.hud-right{display:flex;gap:8px;align-items:center}
.hud-col{flex-direction:column;align-items:flex-start;gap:6px}
.hud-row{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%}
.hud-right{flex:none}
.pill{min-width:0}
#hearts{letter-spacing:-2px}
#missionPill{max-width:100%;overflow:hidden;text-overflow:ellipsis;display:block}
#pauseBtn{padding:4px 10px;font-size:20px;line-height:1.2}
@media (max-width:420px){.hud{font-size:16px}.pill{padding:4px 9px;gap:4px}}
.pill[hidden]{display:none}
.pill{background:rgba(255,255,255,.88);border-radius:999px;padding:5px 14px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.pill.mini{font-size:clamp(13px,3.4vw,16px);padding:4px 12px}
.pill.mini.done{background:#FFE9A8}
#sound,#fsBtn,#pauseBtn{pointer-events:auto;border:0;font:inherit;cursor:pointer;color:inherit}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(43,58,85,.28)}
.overlay[hidden]{display:none}
.card{
  background:var(--card);color:var(--ink);border-radius:28px;padding:18px 18px 20px;text-align:center;
  max-width:440px;width:100%;max-height:100%;overflow-y:auto;box-shadow:0 6px 0 rgba(43,58,85,.3);
}
h1{font-size:clamp(32px,9vw,48px);margin:0;font-weight:800;color:var(--accent);line-height:1.15}
h2{font-size:clamp(26px,7vw,36px);margin:0 0 4px;font-weight:800;color:var(--accent);line-height:1.2}
p{font-size:clamp(15px,4.2vw,19px);line-height:1.6;margin:4px 0;font-weight:500}
.big{font-size:clamp(21px,5.8vw,28px);font-weight:800;margin:2px 0}
.soft{opacity:.75}
.hero{display:block;margin:0 auto}
.btns{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:10px}
.row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
button.go{
  font:inherit;font-weight:800;font-size:clamp(23px,6.2vw,30px);color:#fff;background:var(--accent);
  border:0;border-radius:999px;padding:11px 42px;box-shadow:0 6px 0 var(--accent-dark);cursor:pointer;
}
button.go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--accent-dark)}
button.go:disabled{background:#B8C2CE;box-shadow:0 6px 0 #8F9AA8;cursor:default}
button.sub{
  font:inherit;font-weight:800;font-size:clamp(17px,4.6vw,21px);color:var(--accent);background:transparent;
  border:3px solid var(--accent);border-radius:999px;padding:7px 24px;cursor:pointer;
}
button.sub[hidden]{display:none}
button:focus-visible{outline:4px solid var(--sun);outline-offset:4px}
.mission{background:var(--chip);border-radius:18px;padding:8px 12px;margin:8px 0 4px;font-weight:800;font-size:clamp(15px,4.2vw,18px)}
.mission .t{font-size:13px;opacity:.7;font-weight:800}
.mission.done{background:#FFE9A8}
.prog{display:flex;align-items:center;gap:8px;margin:4px auto;max-width:340px;text-align:left}
.prog canvas{flex:none}
.bar{flex:1;height:14px;border-radius:999px;background:rgba(43,58,85,.15);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#FF8A3D,#FFC93C);border-radius:999px;transition:width .5s}
.prog .lbl{font-weight:800;font-size:14px;white-space:nowrap;min-width:78px;text-align:right}
.progwrap{margin-top:6px}
.progwrap .t{font-size:13px;opacity:.7;font-weight:800;margin:0}
.selcard{padding:14px 12px 16px}
.prev{display:flex;align-items:center;gap:10px;background:var(--chip);border-radius:24px;padding:6px 10px}
.prev canvas{flex:none}
.prevtxt{flex:1;min-width:0;text-align:left}
.prevtxt .big{margin:0;font-size:clamp(19px,5.4vw,24px)}
.prevtxt .soft{margin:2px 0 0;font-size:14px;line-height:1.4}
button.sub.small{font-size:15px;padding:4px 14px;margin-top:4px}
.tabs{display:flex;gap:8px;justify-content:center;margin:10px 0 6px}
.tab{font:inherit;font-weight:800;font-size:18px;color:var(--ink);background:var(--chip);border:3px solid transparent;border-radius:999px;padding:6px 22px;cursor:pointer;opacity:.7}
.tab.on{border-color:var(--accent);opacity:1}
.pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;touch-action:pan-y}
.pager .arrow{width:46px;height:46px;font-size:30px}
.pager .dots{margin:0}
.tile{position:relative;min-width:0;background:var(--chip);border:3px solid transparent;border-radius:16px;padding:3px;cursor:pointer;aspect-ratio:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile canvas{width:100%!important;height:auto!important;max-height:100%}
.tile.sel{border-color:var(--accent)}
.tile.locked{opacity:.6}
.tile .lock{position:absolute;right:4px;top:2px;font-size:16px}
.tile .new{position:absolute;left:4px;top:2px;background:#E94F5C;color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 6px}
.tile .pen{font-size:28px;width:auto;height:auto}
.carousel{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:4px}
.arrow{font:inherit;font-size:34px;font-weight:800;color:var(--accent);background:var(--chip);border:0;border-radius:50%;width:52px;height:52px;cursor:pointer;line-height:1;flex:none}
.stage{background:var(--chip);border-radius:28px;padding:8px;touch-action:pan-y;position:relative}
.stage canvas{display:block}
.stage.locked::after{content:'🔒';position:absolute;right:10px;top:8px;font-size:26px}
.dots{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin:8px 0 0;max-width:300px;margin-inline:auto}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(43,58,85,.25)}
.dot.on{background:var(--accent);transform:scale(1.4)}
.dot.pen{background:#A77BD8}
.tag{display:inline-block;background:#FFE9A8;color:#8A5A00;border-radius:999px;padding:2px 12px;font-size:14px;font-weight:800}
.newbox{margin-top:8px;padding:8px;border-radius:20px;background:#FFE9A8;color:#2B3A55}
.newbox[hidden]{display:none}
.newrow{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.newrow div{display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:18px}
.drawcv{display:block;margin:8px auto;width:min(100%,300px,42vh);aspect-ratio:1;background:#F3F5F8;border:3px dashed #C9D3DE;border-radius:20px;touch-action:none;cursor:crosshair}
.palette{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:6px 0 10px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid rgba(43,58,85,.25);cursor:pointer;padding:0}
.sw.on{outline:4px solid var(--accent);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.tool{font:inherit;font-weight:800;font-size:15px;color:var(--ink);background:var(--chip);border:3px solid transparent;border-radius:999px;padding:6px 12px;cursor:pointer}
.tool.on{border-color:var(--accent)}
.warn{color:#E94F5C;font-weight:800;min-height:1.2em;margin:6px 0 0}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" aria-label="ゲームがめん"></canvas>

  <div class="hud hud-col" id="hud" hidden>
    <div class="hud-row">
      <div class="pill" id="hearts" aria-label="ライフ">❤️❤️❤️</div>
      <div class="hud-right">
        <div class="pill" id="berries">🍓 0</div>
        <div class="pill" id="meters">0 m</div>
        <button class="pill" id="pauseBtn" aria-label="ポーズ">⏸</button>
      </div>
    </div>
    <div class="pill mini" id="missionPill"></div>
  </div>

  <div class="overlay" id="pauseScreen" hidden>
    <div class="card">
      <h2>ちょっと きゅうけい</h2>
      <div class="btns">
        <button class="go" id="resumeBtn">つづける</button>
        <div class="row">
          <button class="sub" id="restartBtn">はじめから</button>
          <button class="sub" id="quitBtn">トップへ</button>
        </div>
      </div>
    </div>
  </div>
  <div class="hud" style="justify-content:flex-end;top:auto;bottom:10px;align-items:center">
    <button class="pill" id="fsBtn" aria-label="ぜんがめん きりかえ" hidden>ぜんがめん</button>
    <button class="pill" id="sound" aria-label="おと オン・オフ">🔊</button>
  </div>

  <div class="overlay" id="startScreen">
    <div class="card">
      <canvas class="hero" id="heroCv" data-size="120"></canvas>
      <h1>ぴよランナー</h1>
      <p><b id="heroName">ぴよ</b> と はしろう！</p>
      <div class="mission" id="missionBox"></div>
      <div class="progwrap" id="progStart"></div>
      <div class="btns">
        <button class="go" id="startBtn">はじめる</button>
        <button class="sub" id="pickBtn1">なかまを えらぶ</button>
        <button class="tool" id="adultBtn">おとなモード：オフ</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="overScreen" hidden>
    <div class="card">
      <h2 id="overTitle">おしまい！</h2>
      <div class="row">
        <p class="big" id="resultBerries">🍓 0 こ</p>
        <p class="big" id="resultMeters">0 メートル</p>
      </div>
      <p class="big" id="resultCombo" style="font-size:clamp(17px,4.6vw,21px)"></p>
      <p id="bestLine"></p>
      <div class="mission" id="missionResult"></div>
      <div class="newbox" id="newBox" hidden>
        <p class="big">🎉 あたらしい なかま！</p>
        <div class="newrow" id="newRow"></div>
      </div>
      <div class="progwrap" id="progOver"></div>
      <div class="btns">
        <button class="go" id="againBtn">もういちど</button>
        <div class="row">
          <button class="sub" id="pickBtn2">なかまを えらぶ</button>
          <button class="sub" id="homeBtn">トップへ</button>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="selectScreen" hidden>
    <div class="card selcard">
      <div class="prev">
        <canvas id="selCv" data-size="130"></canvas>
        <div class="prevtxt">
          <p class="big" id="selName"></p>
          <p class="soft" id="selCond"></p>
          <button class="sub small" id="editBtn" hidden>✏️ かきなおす</button>
        </div>
      </div>
      <div class="tabs">
        <button class="tab on" data-tab="chars">なかま</button>
        <button class="tab" data-tab="hats">ぼうし</button>
      </div>
      <div class="tiles" id="tiles"></div>
      <div class="pager">
        <button class="arrow" id="prevBtn" aria-label="まえのページ">‹</button>
        <div class="dots" id="dots"></div>
        <button class="arrow" id="nextBtn" aria-label="つぎのページ">›</button>
      </div>
      <div class="btns"><button class="go" id="backBtn">もどる</button></div>
    </div>
  </div>

  <div class="overlay" id="drawScreen" hidden>
    <div class="card">
      <h2>おえかき なかま</h2>
      <p class="soft">かおを みぎむきに かくと、まえを むいて はしるよ</p>
      <canvas id="drawCv" class="drawcv" aria-label="おえかき キャンバス"></canvas>
      <div class="palette" id="palette"></div>
      <div class="tools">
        <button class="tool" data-size="6">ほそい</button>
        <button class="tool on" data-size="12">ふつう</button>
        <button class="tool" data-size="22">ふとい</button>
        <button class="tool" id="fillBtn">🪣 ぬりつぶし</button>
        <button class="tool" id="eraserBtn">けしゴム</button>
        <button class="tool" id="undoBtn">もどす</button>
        <button class="tool" id="clearBtn">ぜんぶ けす</button>
      </div>
      <p class="warn" id="drawMsg"></p>
      <div class="btns">
        <button class="go" id="doneBtn">できた！</button>
        <button class="sub" id="cancelDrawBtn">やめる</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const hudEl = $('hud'), heartsEl = $('hearts'), berriesEl = $('berries'), metersEl = $('meters'), missionPill = $('missionPill');
  const startScreen = $('startScreen'), overScreen = $('overScreen'), selectScreen = $('selectScreen'), drawScreen = $('drawScreen');

  // ---------- characters ----------
  const CHARS = [
    { id: 'piyo', name: 'ぴよ', need: null },
    { id: 'inu', name: 'いぬ', need: { berries: 10 } },
    { id: 'neko', name: 'ねこ', need: { meters: 150 } },
    { id: 'azarashi', name: 'あざらし', need: { berries: 30 } },
    { id: 'penguin', name: 'ペンギン', need: { meters: 300 } },
    { id: 'shimaenaga', name: 'シマエナガ', need: { meters: 400 } },
    { id: 'omochi', name: 'おもち', need: { berries: 60 } },
    { id: 'hitsuji', name: 'ひつじ', need: { berries: 100 } },
    { id: 'donguri', name: 'どんぐり', need: { berries: 150 } },
    { id: 'tamago', name: 'たまご', need: { meters: 600 } },
    { id: 'onigiri', name: 'おにぎり', need: { berries: 220 } },
    { id: 'kumo', name: 'くもっこ', need: { meters: 800 } },
    { id: 'usagi', name: 'うさぎ', need: { berries: 45 } },
    { id: 'kaeru', name: 'かえる', need: { meters: 250 } },
    { id: 'kuma', name: 'くま', need: { berries: 320 } },
    { id: 'kitsune', name: 'きつね', need: { meters: 700 } },
    { id: 'panda', name: 'パンダ', need: { berries: 500 } },
    { id: 'fukurou', name: 'ふくろう', need: { meters: 1000 } },
    { id: 'bigshima', name: 'いちごシマエナガ', need: { berries: 1000 }, special: true },
    { id: 'ousama', name: 'おうさまぴよ', need: { berries: 2000 }, special: true },
    { id: 'nijikumo', name: 'にじくもっこ', need: { berries: 3000 }, special: true },
    { id: 'kinneko', name: 'きんいろねこ', need: { berries: 4000 }, special: true },
    { id: 'ryuchan', name: 'りゅうちゃん', need: { berries: 5000 }, special: true },
    { id: 'kingshima', name: 'キングシマエナガ', need: { berries: 6000 }, special: true },
    { id: 'nijipiyo', name: 'にじいろぴよ', need: { berries: 7000 }, special: true },
    { id: 'buta', name: 'ぶた', need: { berries: 700 } },
    { id: 'nezumi', name: 'ねずみ', need: { berries: 900 } },
    { id: 'iruka', name: 'いるか', need: { meters: 1200 } },
    { id: 'harinezumi', name: 'はりねずみ', need: { berries: 1300 } },
    { id: 'yukidaruma', name: 'ゆきだるま', need: { meters: 1500 } },
    { id: 'kotori', name: 'ことり', need: { runs: 15 } },
    { id: 'koala', name: 'コアラ', need: { berries: 1600 } },
    { id: 'kame', name: 'かめ', need: { meters: 1800 } },
    { id: 'tako', name: 'たこ', need: { berries: 2000 } },
    { id: 'kingyo', name: 'きんぎょ', need: { meters: 2000 } },
    { id: 'komori', name: 'こうもり', need: { missions: 20 } },
    { id: 'kani', name: 'かに', need: { combo: 25 } },
    { id: 'ushi', name: 'うし', need: { berries: 2400 } },
    { id: 'lion', name: 'ライオン', need: { meters: 2500 } },
    { id: 'zou', name: 'ぞう', need: { berries: 2800 } },
    { id: 'kurage', name: 'くらげ', need: { runs: 35 } },
    { id: 'kirin', name: 'きりん', need: { meters: 3000 } },
    { id: 'wani', name: 'わに', need: { berries: 3300 } },
    { id: 'saru', name: 'さる', need: { missions: 40 } },
    { id: 'risu', name: 'りす', need: { berries: 3600 } },
  ].sort((x, y) => {
    const k = c => !c.need ? 0 : (c.special ? 100000 : 0) + (c.need.berries ? c.need.berries * 3 : c.need.meters ? c.need.meters : c.need.runs ? c.need.runs * 200 : c.need.missions ? c.need.missions * 250 : c.need.combo * 250);
    return k(x) - k(y);
  });
  const byId = id => CHARS.find(c => c.id === id) || CHARS[0];

  function E(c, x, y, rx, ry, rot, f) { c.fillStyle = f; c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); c.fill(); }
  function tri(c, a, b, d, e, f, g) { c.beginPath(); c.moveTo(a, b); c.lineTo(d, e); c.lineTo(f, g); c.closePath(); c.fill(); }
  function eye(c, x, y, s) { E(c, x, y, s, s, 0, '#2B3A55'); E(c, x + s * 0.3, y - s * 0.35, s * 0.35, s * 0.35, 0, '#fff'); }
  function legs(c, cx, cy, r, a, col, w) {
    c.strokeStyle = col; c.lineWidth = w || 4; c.lineCap = 'round'; c.beginPath();
    const fy = cy + r;
    if (a.air) {
      c.moveTo(cx - 6, fy - 6); c.lineTo(cx - 10, fy + 4);
      c.moveTo(cx + 6, fy - 6); c.lineTo(cx + 2, fy + 5);
    } else {
      const s = a.still ? 0 : Math.sin(a.run * 18) * 7;
      c.moveTo(cx - 6, fy - 6); c.lineTo(cx - 6 + s, fy);
      c.moveTo(cx + 6, fy - 6); c.lineTo(cx + 6 - s, fy);
    }
    c.stroke();
  }
  const bobOf = a => (!a.air && !a.still) ? Math.abs(Math.sin(a.run * 18)) * 2 : 0;
  const flapOf = a => a.air ? Math.sin(a.run * 30) * 0.6 : (a.still ? 0 : Math.sin(a.run * 18) * 0.2);

  const DRAW = {
    piyo(c, cx, cy, r, a) {
      legs(c, cx, cy, r, a, '#F07F2C');
      const by = cy - bobOf(a);
      c.strokeStyle = '#F5B21E'; c.lineWidth = 3;
      c.beginPath(); c.arc(cx - 2, by - r - 3, 5, Math.PI * 0.2, Math.PI * 1.3); c.stroke();
      E(c, cx, by, r, r, 0, '#FFC93C');
      E(c, cx - 1, by + 7, r * 0.6, r * 0.45, 0, '#FFE08A');
      E(c, cx - 9, by + 2, 10, 6, -0.3 + flapOf(a), '#F5B21E');
      eye(c, cx + 9, by - 6, 3.4);
      E(c, cx + 12, by + 4, 4.2, 2.6, 0, '#FF9EAA');
      c.fillStyle = '#F07F2C'; tri(c, cx + r - 4, by - 4, cx + r + 9, by - 1, cx + r - 4, by + 3);
    },
    inu(c, cx, cy, r, a) {
      legs(c, cx, cy, r, a, '#A8683C');
      const by = cy - bobOf(a);
      const wag = a.still ? 0 : Math.sin(a.run * 24) * 4;
      c.strokeStyle = '#D9A06B'; c.lineWidth = 6; c.lineCap = 'round';
      c.beginPath(); c.moveTo(cx - r + 4, by + 2); c.quadraticCurveTo(cx - r - 8, by - 2, cx - r - 8 + wag * 0.5, by - 12 + wag); c.stroke();
      E(c, cx, by, r, r, 0, '#E8B887');
      E(c, cx - 2, by + 8, r * 0.58, r * 0.42, 0, '#FFF1DC');
      E(c, cx + r - 5, by + 3, 10, 7.5, 0, '#FFF1DC');
      E(c, cx + r + 2, by, 3.6, 3, 0, '#2B3A55');

        f.got = true;
        const val = f.star ? 5 : 1;

        if (f.h > 100) run.high++;

        sparkle(f.x, fy);

    for (const f of fruits) {

      bonus = MISSION_BONUS;

      confetti(W / 2, groundY * 0.4, 30);
      jingle([659, 784, 988, 1319], 0.1);
    }
    checkLiveUnlocks();
    updateHud(false);
  }

    renderSel();
    refreshStart();
    selectScreen.hidden = false;
  });
  $('cancelDrawBtn').addEventListener('click', () => {
    drawScreen.hidden = true;
    buildItems();
    renderSel();
    selectScreen.hidden = false;
  });

  // ---------- controls ----------
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (state === 'play') jump();
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      if (state === 'play') { e.preventDefault(); jump(); }
    } else if (!selectScreen.hidden) {
      if (e.code === 'ArrowLeft') move(-1);
      if (e.code === 'ArrowRight') move(1);
    }
  });
  document.addEventListener('visibilitychange', () => { last = 0; });

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  newMission();
  updatePalette(0);
  refreshStart();
})();
</script>
</body>
</html>
